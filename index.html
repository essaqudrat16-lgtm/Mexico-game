
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mexico Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #006847, #ffffff, #ce1126);
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: white;
  width: 100%;
  max-width: 650px;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0003;
  text-align: center;
}

h1 {
  color: #006847;
}

#progress {
  color: #555;
  font-weight: bold;
}

#question {
  font-size: 21px;
  margin: 25px 0;
}

button {
  border: none;
  padding: 14px;
  margin: 7px 0;
  width: 100%;
  border-radius: 10px;
  background: #006847;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  cursor: default;
  opacity: 0.8;
}

#feedback {
  font-weight: bold;
  margin: 15px;
}

#nextBtn {
  background: #ce1126;
  display: none;
}

#result {
  display: none;
}

.review-item {
  text-align: left;
  padding: 12px;
  margin: 10px 0;
  background: #f1f1f1;
  border-radius: 8px;
}

.footer {
  margin-top: 30px;
  padding: 20px;
  background: #e8f5ec;
  border-radius: 12px;
  color: #006847;
}
</style>
</head>

<body>

<div class="container">

  <div id="game">
    <h1>🇲🇽 Mexico Quiz 🇲🇽</h1>
    <p>Test your knowledge about Mexico!</p>

    <p id="progress"></p>
    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="feedback"></p>

    <button id="nextBtn" onclick="nextQuestion()">
      Next Question
    </button>
  </div>

  <div id="result">
    <h1>🎉 Quiz Finished!</h1>
    <h2 id="score"></h2>
    <p id="message"></p>

    <div id="review"></div>

    <div class="footer">
      <h2>Made by Essa Mohamed 6A</h2>
      <h3>Thank you for playing! ❤️</h3>
    </div>

    <button onclick="startQuiz()">Play Again 🔄</button>
  </div>

</div>

<script>

const bank = [

["Geography","What is the capital of Mexico?",["Mexico City","Cancún","Oaxaca","Tijuana"],0],
["Geography","Which continent is Mexico in?",["South America","Europe","North America","Asia"],2],
["Geography","What is the most widely spoken language in Mexico?",["English","Spanish","French","Portuguese"],1],
["Geography","What is the currency of Mexico?",["Dollar","Euro","Peso","Pound"],2],
["Geography","Which country borders Mexico to the north?",["Canada","United States","Brazil","Guatemala"],1],
["Geography","Which ocean is on Mexico's west coast?",["Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean"],2],
["Geography","What body of water is east of Mexico?",["Gulf of Mexico","Red Sea","Black Sea","Mediterranean Sea"],0],
["Geography","What is the largest city in Mexico?",["Cancún","Oaxaca","Mexico City","Puebla"],2],
["Flag","What are the colors of the Mexican flag?",["Blue, white, red","Green, white, red","Green, yellow, blue","Red, white, blue"],1],
["Flag","What color is on the left of the Mexican flag?",["Red","White","Green","Blue"],2],
["Flag","What color is in the middle of the Mexican flag?",["White","Green","Red","Yellow"],0],
["Flag","What color is on the right of the Mexican flag?",["Green","White","Red","Blue"],2],
["Flag","What is in the center of the Mexican flag?",["A lion","An eagle and snake","A pyramid","A sun"],1],
["Flag","What is the eagle standing on?",["A rock","A tree","A cactus","A mountain"],2],
["Flag","What is the eagle holding in its beak?",["A fish","A snake","A flower","A leaf"],1],
["Flag","What bird appears in Mexico's coat of arms?",["Eagle","Parrot","Owl","Falcon"],0],
["Nature","What plant appears in Mexico's coat of arms?",["Rose","Palm tree","Prickly pear cactus","Sunflower"],2],
["Nature","What is Mexico's national flower?",["Dahlia","Tulip","Rose","Lily"],0],
["Nature","What is a nopal?",["A bird","A type of cactus","A musical instrument","A hat"],1],
["Culture","What is a sombrero?",["A type of food","A wide-brimmed hat","A dance","A musical instrument"],1],
["History","Who built Chichén Itzá?",["Romans","Maya","Egyptians","Greeks"],1],
["History","The Pyramid of the Sun is in which ancient city?",["Teotihuacán","Cancún","Oaxaca","Tijuana"],0],
["History","When did the fight for Mexican independence begin?",["1492","1810","1910","2000"],1],
["History","When is Mexico's Independence Day?",["September 16","July 4","December 25","January 1"],0],
["History","What is celebrated on November 1 and 2 in Mexico?",["New Year's Day","Día de Muertos","Independence Day","Christmas"],1],
["History","Where is El Castillo located?",["Mexico City","Chichén Itzá","Cancún","Oaxaca"],1],
["Places","Where can you find canals and colorful boats?",["Xochimilco","Tijuana","Puebla","Monterrey"],0],
["Places","Which place is famous for beaches on the Yucatán Peninsula?",["Cancún","Oaxaca","Toluca","Puebla"],0],
["Places","Which Mexican state shares its name with its capital city, Oaxaca?",["Chiapas","Oaxaca","Yucatán","Sonora"],1],
["Places","Which peninsula is in northwestern Mexico?",["Yucatán","Baja California","Florida","Arabian"],1],
["Food","Tacos are usually made with what?",["Corn or wheat tortillas","Bread","Rice paper","Pasta"],0],
["Food","What is guacamole mainly made from?",["Tomatoes","Avocados","Potatoes","Carrots"],1],
["Food","What is a corn-dough parcel wrapped and steamed?",["Taco","Tamale","Churro","Pozole"],1],
["Food","What are churros?",["Fried dough treats","A soup","A drink","A sandwich"],0],
["Food","What is pozole?",["A cake","A hominy soup or stew","A salad","A fruit"],1],
["Food","Which sauce is made with chili and chocolate?",["Ketchup","Mole","Mustard","Mayonnaise"],1],
["Music","What is mariachi?",["A traditional music style","A food","A dance shoe","A hat"],0],
["Music","Which instrument is common in mariachi music?",["Trumpet","Flute","Drums only","Piano"],0],
["Music","What is a vihuela mexicana?",["A small guitar-like instrument","A trumpet","A drum","A type of flute"],0],
["Music","What is the traditional mariachi outfit called?",["Traje de charro","Sombrero de fiesta","Traje de baile","Poncho"],0],
["Spanish","What does ¡Hola! mean?",["Goodbye","Hello","Thank you","Please"],1],
["Spanish","How do you say 'Thank you' in Spanish?",["Hola","Adiós","Gracias","Sí"],2],
["Spanish","What does Buenos días mean?",["Good night","Good morning","Goodbye","See you later"],1],
["Spanish","How do you say 'Please' in Spanish?",["Por favor","Gracias","Adiós","Sí"],0],
["Spanish","What does ¿Cómo estás? mean?",["Where are you?","How are you?","What is your name?","Good night"],1],
["Spanish","What does Adiós mean?",["Hello","Goodbye","Please","Thank you"],1],
["Spanish","How do you say 'Yes' in Spanish?",["No","Sí","Hola","Gracias"],1],
["Spanish","What does De nada mean?",["You're welcome","Good morning","Goodbye","Please"],0],
["Spanish","What does Hasta luego mean?",["See you later","Good night","Thank you","Hello"],0],
["Spanish","How do you say 'Good night' in Spanish?",["Buenos días","Buenas noches","Por favor","Adiós"],1]

];

let questions = [];
let current = 0;
let score = 0;
let history = [];

function shuffle(array) {
  let copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function startQuiz() {
  questions = shuffle(bank).slice(0, 10);
  current = 0;
  score = 0;
  history = [];

  document.getElementById("game").style.display = "block";
  document.getElementById("result").style.display = "none";

  showQuestion();
}

function showQuestion() {
  let q = questions[current];

  document.getElementById("progress").textContent =
    "Question " + (current + 1) + " of 10";

  document.getElementById("question").textContent = q[1];

  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";

  let answers = q[2].map((answer, index) => ({
    text: answer,
    correct: index === q[3]
  }));

  answers = shuffle(answers);

  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  answers.forEach(answer => {
    let button = document.createElement("button");
    button.textContent = answer.text;

    button.onclick = function() {
      chooseAnswer(answer, button);
    };

    answersDiv.appendChild(button);
  });
}

function chooseAnswer(answer, selectedButton) {
  let buttons = document.querySelectorAll("#answers button");

  buttons.forEach(button => {
    button.disabled = true;
  });

  let correctAnswer = questions[current][2][questions[current][3]];

  let right = answer.correct;

  if (right) {
    score++;
    document.getElementById("feedback").textContent = "✅ Correct! Great job!";
  } else {
    document.getElementById("feedback").textContent =
      "❌ Not quite! The correct answer is " + correctAnswer;
  }

  history.push({
    question: questions[current][1],
    selected: answer.text,
    correct: correctAnswer,
    right: right
  });

  selectedButton.style.background = right ? "#16803c" : "#ce1126";

  document.getElementById("nextBtn").style.display = "block";

  if (current === 9) {
    document.getElementById("nextBtn").textContent = "See My Results";
  } else {
    document.getElementById("nextBtn").textContent = "Next Question";
  }
}

function nextQuestion() {
  current++;

  if (current < 10) {
    showQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  document.getElementById("game").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("score").textContent =
    "Your score: " + score + " / 10";

  let message = "";

  if (score === 10) {
    message = "Perfect score! Amazing! 🏆";
  } else if (score >= 7) {
    message = "Great job! Keep it up! 🌟";
  } else if (score >= 5) {
    message = "Good effort! Keep practicing! 👍";
  } else {
    message = "Keep learning! You can do it! 💪";
  }

  document.getElementById("message").textContent = message;

  let review = "<h2>Answer Review</h2>";

  history.forEach((item, index) => {
    review += `
      <div class="review-item">
        <b>${index + 1}. ${item.question}</b><br><br>
        Your answer: ${item.selected}<br>
        ${item.right
          ? "✅ Correct!"
          : "❌ Correct answer: " + item.correct}
      </div>
    `;
  });

  document.getElementById("review").innerHTML = review;
}

startQuiz();

</script>

</body>
</html>
